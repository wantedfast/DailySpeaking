# Include inside the existing server {} block. Preserve other locations.
location = /dailyspeaking {
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:3014;
    include /etc/nginx/snippets/dailyspeaking-proxy.conf;
}
location ^~ /dailyspeaking/ {
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:3014;
    include /etc/nginx/snippets/dailyspeaking-proxy.conf;
}
location = /dailyspeaking/api/documents {
    client_max_body_size 21m;
    proxy_pass http://127.0.0.1:3014;
    include /etc/nginx/snippets/dailyspeaking-proxy.conf;
}
